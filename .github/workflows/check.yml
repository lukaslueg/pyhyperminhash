name: Clippy, Format

on: [pull_request, push, workflow_dispatch]

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all --tests -- -D warnings

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pyver: ["3.9", "3.13", "3.14"]
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.pyver }}
      - name: Create venv
        run: python3 -m venv .venv
      - name: Run ruff
        run: |
          set -e
          source .venv/bin/activate
          pip install --upgrade pip
          pip install mypy ruff
          ruff check --verbose
          ruff format --check --diff
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          args: --out dist ${{ matrix.features }}
      - name: Run pytest
        run: |
          set -e
          source .venv/bin/activate
          pip install pyhyperminhash --find-links dist --force-reinstall
          pip install pytest
          RUST_BACKTRACE=1 pytest -v
      - name: Run stubtest
        run: |
          set -e
          source .venv/bin/activate
          # The shipped stub describes the public package API at `pyhyperminhash`.
          # The compiled extension submodule (`pyhyperminhash.pyhyperminhash`) is an
          # implementation detail and does not ship a separate stub file.
          python -m mypy.stubtest --ignore-missing-stub pyhyperminhash
      - name: Check stub compatibility with oldest supported Python
        run: |
          set -e
          source .venv/bin/activate
          # Keep the stub valid for the declared Python 3.9+ support range; stubtest
          # checks runtime parity, but not whether the annotations themselves are too new.
          mypy --python-version 3.9 pyhyperminhash.pyi
      - name: Run examples
        run: |
          set -e
          source .venv/bin/activate
          python3 examples/simple.py
          python3 examples/sqlite_agg.py
          python3 examples/large_file.py
          python3 examples/unique_files.py tests examples
